quarkus.http.port=8080
quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS:redis://localhost:6379}
webrtc.room.ttl-seconds=${WEBRTC_ROOM_TTL_SECONDS:900}

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, x-client-id, x-client-secret